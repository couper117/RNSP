version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rwasport_app
    working_dir: /app
    environment:
      - DB_HOST=mysql
      - REDIS_HOST=redis
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - mysql
      - redis
    networks:
      - rwasport

  mysql:
    image: mysql:8.0
    container_name: rwasport_mysql
    environment:
      MYSQL_DATABASE: rwasport
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - rwasport

  redis:
    image: redis:7-alpine
    container_name: rwasport_redis
    ports:
      - "6379:6379"
    networks:
      - rwasport

  mailhog:
    image: mailhog/mailhog:latest
    container_name: rwasport_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - rwasport

networks:
  rwasport:
    driver: bridge

volumes:
  mysql_data:
